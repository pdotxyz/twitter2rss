name: twitter2rss

on:
  workflow_dispatch:
  repository_dispatch:
    types: [hourly-rss]

permissions:
  contents: write

concurrency:
  group: twitter2rss
  cancel-in-progress: false

jobs:
  update-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate RSS feeds
        id: generate
        shell: bash
        run: |
          set +e
          uv run twitter2rss.py $(cat users.txt) 2>&1 | tee twitter2rss.log
          success_count=$(grep -c ': wrote ' twitter2rss.log || true)

          mkdir -p docs
          for file in ./*.xml; do
            [ -f "$file" ] || continue
            mv "$file" docs/
          done

          echo "success_count=$success_count" >> "$GITHUB_OUTPUT"
          echo "Successful users: $success_count" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Commit updated feeds
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Twitter RSS feeds"
          file_pattern: "docs/*.xml"

      - name: Fail only if all users failed
        if: steps.generate.outputs.success_count == '0'
        run: exit 1
